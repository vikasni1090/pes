services:

  mongo:
    image: mongo:7
    container_name: peer_eval_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./Backend
    container_name: peer_eval_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/peer_evaluation
      JWT_SECRET: your_secure_random_string_here
      EMAIL_USER: name@gmail.com
      EMAIL_PASS: passkey
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build: ./Frontend
    container_name: peer_eval_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
